    <script>
      (function(){
        try {
          var rawMsgs = localStorage.getItem('archaeophd_local_messages');
          if (rawMsgs) {
            try {
              var parsedM = JSON.parse(rawMsgs);
              if (Array.isArray(parsedM)) {
                parsedM.sort(function(a, b) {
                  var ta = new Date(a.created_date || a.timestamp || 0).getTime() || parseInt((a.id || '').replace(/\D/g, '') || 0);
                  var tb = new Date(b.created_date || b.timestamp || 0).getTime() || parseInt((b.id || '').replace(/\D/g, '') || 0);
                  if (ta !== tb) return ta - tb;
                  return a.role === 'user' ? -1 : 1;
                });
                localStorage.setItem('archaeophd_local_messages', JSON.stringify(parsedM));
              }
            } catch(e){}
          }
          var DEMO_PROJ = {
            id: 'demo-southern-levant',
            title: 'Excavations at Tell es-Sultan (Jericho) & Southern Levant Horizons',
            name: 'Excavations at Tell es-Sultan (Jericho) & Southern Levant Horizons',
            research_period: 'Early to Middle Bronze Age (ca. 2500 - 1550 BCE)',
            research_region: 'Southern Levant (Jordan Rift Valley)',
            research_question: 'Stratigraphic synchronization of Bronze Age destruction layers and ceramic typologies.',
            keywords: ['Stratigraphy', 'Radiocarbon Dating', 'Kenyon Trench', 'Pottery Typology'],
            is_demo: true,
            is_system_demo: true,
            created_date: '2026-01-01T00:00:00.000Z'
          };
          var projStr = localStorage.getItem('archaeophd_local_projects');
          var projs = [];
          try { projs = projStr ? JSON.parse(projStr) : []; } catch(e) { projs = []; }
          if (!Array.isArray(projs)) projs = [];
          var hasDemo = projs.some(function(p) { return p && (p.is_demo || p.id === 'demo-southern-levant'); });
          if (!hasDemo) {
            projs.unshift(DEMO_PROJ);
            localStorage.setItem('archaeophd_local_projects', JSON.stringify(projs));
          }
          var claimsStr = localStorage.getItem('archaeophd_local_claims');
          if (claimsStr) {
            try {
              var claims = JSON.parse(claimsStr);
              if (Array.isArray(claims)) {
                var filteredC = claims.filter(function(c) {
                  var txt = (c.claim_text || '') + ' ' + (c.text || '') + ' ' + (c.title || '');
                  return txt.indexOf('Tell es-Sultan') === -1 &&
                         txt.indexOf('1550 BCE') === -1 &&
                         txt.indexOf('Stratum IV') === -1 &&
                         txt.indexOf('Kenyon') === -1 &&
                         txt.indexOf('Southern Levant') === -1;
                });
                if (filteredC.length !== claims.length) {
                  localStorage.setItem('archaeophd_local_claims', JSON.stringify(filteredC));
                }
              }
            } catch(e){}
          }
          var sitesStr = localStorage.getItem('archaeophd_local_sites');
          if (sitesStr) {
            try {
              var sites = JSON.parse(sitesStr);
              if (Array.isArray(sites)) {
                var filteredS = sites.filter(function(s) {
                  var name = (s.site_name || '') + ' ' + (s.name || '');
                  return name.indexOf('Tell es-Sultan') === -1 &&
                         name.indexOf('Jericho') === -1 &&
                         name.indexOf('Megiddo') === -1 &&
                         name.indexOf('Hazor') === -1;
                });
                if (filteredS.length !== sites.length) {
                  localStorage.setItem('archaeophd_local_sites', JSON.stringify(filteredS));
                }
              }
            } catch(e){}
          }
          var sourcesStr = localStorage.getItem('archaeophd_local_sources');
          if (sourcesStr) {
            try {
              var sources = JSON.parse(sourcesStr);
              if (Array.isArray(sources)) {
                var filteredSrc = sources.filter(function(sc) {
                  var a = (sc.author || '') + ' ' + (sc.title || '');
                  return a.indexOf('Kenyon') === -1 &&
                         a.indexOf('Wood') === -1 &&
                         a.indexOf('Corvinus') === -1 &&
                         a.indexOf('Sankalia') === -1;
                });
                if (filteredSrc.length !== sources.length) {
                  localStorage.setItem('archaeophd_local_sources', JSON.stringify(filteredSrc));
                }
              }
            } catch(e){}
          }
        } catch(e){}
      })();

            window.__B44_DB__.entities = new Proxy({}, {
        get: function(target, entityName) {
          var keyMap = {
            Project: 'projects',
            ResearchProject: 'projects',
            Claim: 'claims',
            Evidence: 'evidence',
            Source: 'sources',
            Note: 'notes',
            ChatMessage: 'messages'
          };
          var entityKey = keyMap[entityName] || (entityName.toLowerCase() + 's');
          var storageKey = 'archaeophd_local_' + entityKey;
          
          function getAll() {
            try {
              var raw = localStorage.getItem(storageKey);
              return raw ? JSON.parse(raw) : [];
            } catch(e) { return []; }
          }
          
          function saveAll(items) {
            try {
              localStorage.setItem(storageKey, JSON.stringify(items));
            } catch(e) {}
          }

          return {
            list: async function(opts, limit) {
              var items = getAll();
              opts = opts || {};
              if (opts.project_id && entityKey !== 'projects') {
                items = items.filter(function(x) { return (x.project_id || 'default') === opts.project_id; });
              }
              return limit ? items.slice(0, limit) : items;
            },
            filter: async function(query, sort, limit) {
              var items = getAll();
              query = query || {};
              if (query.project_id && entityKey !== 'projects') {
                items = items.filter(function(x) {
                  return (x.project_id || 'default') === query.project_id;
                });
              }
              if (entityKey === 'messages' || sort === 'created_date') {
                items.sort(function(a, b) {
                  var ta = new Date(a.created_date || a.timestamp || 0).getTime() || parseInt((a.id || '').replace(/\D/g, '') || 0);
                  var tb = new Date(b.created_date || b.timestamp || 0).getTime() || parseInt((b.id || '').replace(/\D/g, '') || 0);
                  if (ta !== tb) return ta - tb;
                  return a.role === 'user' ? -1 : 1;
                });
              }
              return limit ? items.slice(0, limit) : items;
            },
            get: async function(id) {
              var items = getAll();
              return items.find(function(x) { return x.id === id; }) || null;
            },
            create: async function(data) {
              var items = getAll();
              var activeProj = (window.APD_PROJECT && window.APD_PROJECT.getActiveId()) || 'default';
              var record = Object.assign({
                id: data.id || ('local-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6)),
                project_id: data.project_id || (entityKey === 'projects' ? undefined : activeProj),
                created_date: new Date().toISOString()
              }, data);
              items.push(record);
              saveAll(items);
              return record;
            },
            bulkCreate: async function(batch) {
              if (!batch) return [];
              var batchArr = Array.isArray(batch) ? batch : [batch];
              var items = getAll();
              var created = [];
              var activeProj = (window.APD_PROJECT && window.APD_PROJECT.getActiveId()) || 'default';
              for (var i = 0; i < batchArr.length; i++) {
                var d = batchArr[i];
                var record = Object.assign({
                  id: d.id || ('local-' + Date.now() + '-' + i + '-' + Math.random().toString(36).substr(2, 6)),
                  project_id: d.project_id || (entityKey === 'projects' ? undefined : activeProj),
                  created_date: new Date().toISOString()
                }, d);
                items.push(record);
                created.push(record);
              }
              saveAll(items);
              return created;
            },
            update: async function(id, patch) {
              var items = getAll();
              var updated = null;
              items = items.map(function(x) {
                if (x.id === id) {
                  updated = Object.assign({}, x, patch);
                  return updated;
                }
                return x;
              });
              saveAll(items);
              return updated || Object.assign({ id: id }, patch);
            },
            delete: async function(id) {
              var items = getAll();
              items = items.filter(function(x) { return x.id !== id; });
              saveAll(items);
              return true;
            }
          };
        }
